name: Restful Booker Database API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: booker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: booker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL and create schema
        run: |
          python - <<'PY'
          import time
          import mysql.connector

          for attempt in range(30):
              try:
                  connection = mysql.connector.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      password="root",
                      database="booker",
                  )
                  connection.close()
                  break
              except mysql.connector.Error:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY
          mysql -h 127.0.0.1 -P 3306 -uroot -proot booker < db/schema.sql

      - name: Run tests
        run: pytest -v
